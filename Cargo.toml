[package]
name = "kuroe"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
description = "Self-hosted deployment server for Docker hosts"
license = "GPL-3.0-or-later"
repository = "https://github.com/SalahaldinBilal/kuroe"
homepage = "https://github.com/SalahaldinBilal/kuroe"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
bollard = "0.21.1"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "migrate", "macros", "time", "uuid"] }
rust-embed = "8.13.0"
argon2 = "0.6.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["serde", "macros", "formatting", "parsing"] }
sysinfo = "0.40.0"
toml = "1.1.8"
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower-http = { version = "0.7.1", features = ["trace"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
rand = "0.9"
mime_guess = "2"
futures = "0.3.34"
tokio-util = { version = "0.7.20", features = ["io"] }
bytes = "1"
tar = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
gix = { version = "0.90.0", features = ["blocking-http-transport-reqwest-rust-tls"] }
ring = "0.17.14"
base64 = "0.22.1"
x509-parser = "0.18.1"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.28"
