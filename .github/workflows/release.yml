name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/salahaldinbilal/kuroe

jobs:
  check:
    name: Check version
    if: github.actor == 'SalahaldinBilal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml. Run npm run version:bump first."
            exit 1
          fi

  ci:
    name: CI
    needs: check
    uses: ./.github/workflows/ci.yml

  binary:
    name: Binary (${{ matrix.arch }})
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      - name: Build
        run: |
          KUROE_BUILD=$(git rev-parse --short HEAD) cargo build --release --locked
          mkdir out
          cp target/release/kuroe out/kuroe-linux-${{ matrix.arch }}
          cd out
          sha256sum kuroe-linux-${{ matrix.arch }} > kuroe-linux-${{ matrix.arch }}.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.arch }}
          path: out
          retention-days: 1

  image:
    name: Image (${{ matrix.arch }})
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - id: build
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: KUROE_BUILD=${{ steps.build.outputs.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Save digest
        run: |
          mkdir digests
          digest="${{ steps.push.outputs.digest }}"
          touch "digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  manifest:
    name: Image tags
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the version and latest
        working-directory: digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t "$IMAGE:$version" -t "$IMAGE:latest" \
            --annotation "index:org.opencontainers.image.description=Self-hosted deployment server for Docker hosts" \
            --annotation "index:org.opencontainers.image.source=https://github.com/SalahaldinBilal/kuroe" \
            --annotation "index:org.opencontainers.image.licenses=GPL-3.0-or-later" \
            $(printf "$IMAGE@sha256:%s " *)

  release:
    name: GitHub release
    needs: [binary, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: out
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1; next } /^## \[/ { if (found) exit } found' CHANGELOG.md > notes.md
          cp kuroe.service out/
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md out/*
